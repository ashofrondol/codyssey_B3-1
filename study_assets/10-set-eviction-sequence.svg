<svg xmlns="http://www.w3.org/2000/svg" width="880" height="962" viewBox="0 0 880 962" role="img" aria-labelledby="title desc">
<title id="title">SET user:3 "Charlie" 한 줄이 지나가는 길 (한도 30, 명세 예시)</title>
<desc id="desc">사용자가 SET user:3 "Charlie" 를 입력하면 cli.py 가 토큰으로 나누고 명령 표에서 SET 을 찾아 MiniRedis.cmd_set 을 부른다. cmd_set 은 크기 13 을 계산해 OOM 이 아님을 확인하고, 20 + 13 = 33 이 한도 30 을 넘으므로 LRU 리스트의 맨 뒤 user:1 을 리스트·해시맵·장부 순서로 지워 used 를 9 로 만든 뒤, user:3 을 리스트 맨 앞에 넣고 그 노드를 담은 엔트리를 해시맵에 넣어 used 22, evicted 1 이 된다. 결과 튜플 (ResultKind.OK,) 은 format_result 로 OK 가 되어 사용자에게 돌아간다.</desc>
<style>
  text{font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Noto Sans CJK KR",sans-serif;font-size:15px;fill:#1D1F23}
  .bg{fill:#FFFFFF}
  .ts{font-size:13px;fill:#5B6069}
  .th{font-size:17px;font-weight:700}
  .tb{font-weight:700}
  .mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,"Noto Sans Mono CJK KR",monospace;font-size:13.5px}
