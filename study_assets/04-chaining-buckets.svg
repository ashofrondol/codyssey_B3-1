<svg xmlns="http://www.w3.org/2000/svg" width="840" height="524" viewBox="0 0 840 524" role="img" aria-labelledby="title desc">
<title id="title">용량 8 해시맵에 키 6개 — 같은 칸에 오면 줄을 선다(체이닝)</title>
<desc id="desc">용량 8인 해시맵에 name, age, city, email, phone, job 순서로 키 6개를 넣은 실제 상태다. 같은 칸 번호로 접힌 age와 job은 4번 칸, email과 phone은 7번 칸의 이중 연결 리스트에 한 줄로 이어진다. GET job 은 4번 칸의 줄만 앞에서부터 비교해 두 번 만에 찾는다. 키가 없는 칸에도 경계 노드 H 와 T 만 이어진 빈 리스트가 미리 만들어져 있다.</desc>
