<text x="512" y="250"><tspan class="c-blue tb">① </tspan><tspan class="mono">_index('job', 8) = 4</tspan></text>
<text x="512" y="278"><tspan class="c-blue tb">② </tspan><tspan class="ts">버킷 4 줄을 앞에서부터</tspan></text>
<text class="mono" x="534" y="304">age ≠ job</text>
<text class="c-blue" x="620" y="304">→</text>
<text class="mono" x="644" y="304">job == job ✓</text>
<text x="512" y="336"><tspan class="c-blue tb">③ </tspan><tspan class="ts">비교 2번이면 끝</tspan></text>
<line class="ln ln-blue" x1="494" y1="236" x2="384" y2="257" marker-end="url(#arrow-blue)"/>
<text class="ts" x="496" y="396">각 키의 칸 번호 = FNV-1a 해시 % 8</text>
<text class="mono" x="496" y="420">name 6 · age 4 · city 2</text>
<text class="mono" x="496" y="442">email 7 · phone 7 · job 4</text>
<text class="ts" x="24" y="448">노드 data = (키, 값) 튜플 · H/T = 데이터 없는 경계 노드(sentinel)</text>
<text class="ts" x="24" y="472">키가 없는 칸에도 H⇄T 빈 리스트를 미리 만들어 둔다(칸당 184 B)</text>
<text x="24" y="502"><tspan class="tb">로드 팩터 = 6 / 8 = 0.75</tspan><tspan class="ts">  →  "초과"가 아니라 아직 확장 안 함 (7번째 키에서 확장)</tspan></text>
