<rect class="bg" x="0" y="0" width="860" height="584"/>
<text class="th" x="24" y="34">sentinel 이 있는 이중 연결 리스트 — 떼고 붙이는 데 포인터 몇 개만</text>
<text class="ts" x="24" y="56">보라 = 데이터 노드 · 점선 테두리 = sentinel(늘 있는 빈 노드) / 제거됨 · 노랑 = 방금 바뀐 곳 · 위 화살표 = next, 아래 화살표 = prev</text>
<text class="tb" x="24" y="132">① 시작</text>
<text class="ts" x="24" y="152">노드 3개 + sentinel 2개</text>
<text class="ts c-purple" x="368" y="100">◀ 앞 = 최근(MRU)</text>
<text class="ts c-purple" x="656" y="100" text-anchor="end">뒤 = 오래됨(LRU) ▶</text>
<rect class="box dash" x="256" y="112" width="64" height="44" rx="8"/>
<text class="mono" x="288.0" y="139.0" text-anchor="middle">head</text>
<rect class="purple" x="368" y="112" width="64" height="44" rx="8"/>
<text class="mono tb" x="400.0" y="139.0" text-anchor="middle">c</text>
