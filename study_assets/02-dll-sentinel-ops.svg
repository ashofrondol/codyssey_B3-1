<text class="mono tb" x="624.0" y="139.0" text-anchor="middle">a</text>
<rect class="box dash" x="704" y="112" width="64" height="44" rx="8"/>
<text class="mono" x="736.0" y="139.0" text-anchor="middle">tail</text>
<line class="ln" x1="323" y1="126.0" x2="364" y2="126.0" marker-end="url(#arrow)"/>
<line class="ln" x1="365" y1="142.0" x2="324" y2="142.0" marker-end="url(#arrow)"/>
<line class="ln" x1="435" y1="126.0" x2="476" y2="126.0" marker-end="url(#arrow)"/>
<line class="ln" x1="477" y1="142.0" x2="436" y2="142.0" marker-end="url(#arrow)"/>
<line class="ln" x1="547" y1="126.0" x2="588" y2="126.0" marker-end="url(#arrow)"/>
<line class="ln" x1="589" y1="142.0" x2="548" y2="142.0" marker-end="url(#arrow)"/>
<line class="ln" x1="659" y1="126.0" x2="700" y2="126.0" marker-end="url(#arrow)"/>
<line class="ln" x1="701" y1="142.0" x2="660" y2="142.0" marker-end="url(#arrow)"/>
<text class="ts" x="288" y="174" text-anchor="middle">sentinel</text>
<text class="ts" x="736" y="174" text-anchor="middle">sentinel</text>
<text class="tb" x="24" y="226">② 떼어내기</text>
<text class="mono tb" x="24" y="248">remove_node(b)</text>
<text class="ts tb" x="512" y="202" text-anchor="middle">바뀐 연결 2개</text>
<rect class="yellow" x="437" y="213" width="150" height="34" rx="6"/>
<rect class="box dash" x="256" y="208" width="64" height="44" rx="8"/>
<text class="mono" x="288.0" y="235.0" text-anchor="middle">head</text>
<rect class="purple" x="368" y="208" width="64" height="44" rx="8"/>
<text class="mono tb" x="400.0" y="235.0" text-anchor="middle">c</text>
<rect class="purple" x="592" y="208" width="64" height="44" rx="8"/>
<text class="mono tb" x="624.0" y="235.0" text-anchor="middle">a</text>
<rect class="box dash" x="704" y="208" width="64" height="44" rx="8"/>
<text class="mono" x="736.0" y="235.0" text-anchor="middle">tail</text>
<line class="ln" x1="323" y1="222" x2="364" y2="222" marker-end="url(#arrow)"/>
<line class="ln" x1="365" y1="238" x2="324" y2="238" marker-end="url(#arrow)"/>
<line class="ln" x1="435" y1="222" x2="588" y2="222" marker-end="url(#arrow)"/>
<line class="ln" x1="589" y1="238" x2="436" y2="238" marker-end="url(#arrow)"/>
<line class="ln" x1="659" y1="222" x2="700" y2="222" marker-end="url(#arrow)"/>
<line class="ln" x1="701" y1="238" x2="660" y2="238" marker-end="url(#arrow)"/>
<rect class="red dash" x="480" y="276" width="64" height="44" rx="8"/>
<text class="mono tb c-red" x="512.0" y="303.0" text-anchor="middle">b</text>
<text class="ts" x="556" y="303">prev·next·owner = None</text>
<text class="mono" x="24" y="292">node.prev.next = node.next</text>
<text class="mono" x="24" y="312">node.next.prev = node.prev</text>
<text class="ts" x="24" y="332">linked_list.py:109-110</text>
<text class="ts" x="240" y="292">→ c.next = a</text>
<text class="ts" x="240" y="312">→ a.prev = c</text>
<text class="tb" x="24" y="394">③ 맨 앞으로</text>
<text class="mono tb" x="24" y="416">move_to_front(a)</text>
<rect class="box dash" x="256" y="376" width="64" height="44" rx="8"/>
<text class="mono" x="288.0" y="403.0" text-anchor="middle">head</text>
<rect class="yellow" x="368" y="376" width="64" height="44" rx="8"/>
<text class="mono tb" x="400.0" y="403.0" text-anchor="middle">a</text>
<rect class="purple" x="480" y="376" width="64" height="44" rx="8"/>
<text class="mono tb" x="512.0" y="403.0" text-anchor="middle">c</text>
<rect class="box dash" x="592" y="376" width="64" height="44" rx="8"/>
<text class="mono" x="624.0" y="403.0" text-anchor="middle">tail</text>
<line class="ln" x1="323" y1="390.0" x2="364" y2="390.0" marker-end="url(#arrow)"/>
<line class="ln" x1="365" y1="406.0" x2="324" y2="406.0" marker-end="url(#arrow)"/>
<line class="ln" x1="435" y1="390.0" x2="476" y2="390.0" marker-end="url(#arrow)"/>
<line class="ln" x1="477" y1="406.0" x2="436" y2="406.0" marker-end="url(#arrow)"/>
<line class="ln" x1="547" y1="390.0" x2="588" y2="390.0" marker-end="url(#arrow)"/>
<line class="ln" x1="589" y1="406.0" x2="548" y2="406.0" marker-end="url(#arrow)"/>
<text class="ts" x="256" y="452">떼기 2개 + _link 4개 = 포인터 6번 쓰기 · 순회 없음 → <tspan class="tb">O(1)</tspan></text>
<text class="ts" x="256" y="472">linked_list.py:128-131</text>
<rect class="box" x="24" y="496" width="812" height="64" rx="10"/>
<text class="ts" x="40" y="518">빈 리스트</text>
<rect class="box dash" x="104" y="508" width="56" height="40" rx="8"/>
<text class="mono" x="132" y="533" text-anchor="middle">head</text>
<rect class="box dash" x="200" y="508" width="56" height="40" rx="8"/>
<text class="mono" x="228" y="533" text-anchor="middle">tail</text>
<line class="ln" x1="163" y1="520" x2="196" y2="520" marker-end="url(#arrow)"/>
<line class="ln" x1="197" y1="536" x2="164" y2="536" marker-end="url(#arrow)"/>
<text x="280" y="533">빈 리스트도 head ⇄ tail 로 이어져 있어 "비었나?" 분기가 없다</text>
</svg>
