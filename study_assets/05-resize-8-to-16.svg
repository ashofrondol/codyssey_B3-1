<svg xmlns="http://www.w3.org/2000/svg" width="880" height="516" viewBox="0 0 880 516" role="img" aria-labelledby="title desc">
<title id="title">7번째 키가 들어오는 순간 — 8칸에서 16칸으로 이사</title>
<desc id="desc">user:1부터 user:6까지 6개가 든 용량 8 해시맵에 user:7을 옛 5번 칸에 먼저 넣으면 키 7개가 8 × 0.75 = 6을 넘어 용량 16으로 늘어난다. 모든 키를 다시 해싱하면 user:3, user:4, user:5는 같은 번호에 남고 user:1, user:2, user:6은 번호에 8을 더한 칸으로 옮겨 가며, 새 키 user:7도 먼저 옛 5번 칸에 들어간 뒤 다른 키와 함께 다시 해싱되어 13번 칸으로 옮겨진다. 해시의 하위 4번째 비트가 0이면 제자리, 1이면 +8이다.</desc>
