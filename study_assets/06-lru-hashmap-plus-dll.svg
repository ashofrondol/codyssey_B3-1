<text class="mono" x="158" y="252">lru_node =</text>
<text class="mono" x="158" y="274">expire_at = None</text>
<rect class="zone" x="416" y="76" width="440" height="150" rx="10"/>
<text x="432" y="100"><tspan class="tb">이중 연결 리스트 </tspan><tspan class="mono">_lru</tspan></text>
<text class="ts" x="432" y="128">← 앞 = 최근 사용</text>
<text class="ts c-red" x="840" y="128" text-anchor="end">뒤 = 축출 후보 →</text>
