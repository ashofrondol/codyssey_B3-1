</defs>
<rect class="bg" x="0" y="0" width="880" height="520"/>
<text class="th" x="24" y="34">O(1) LRU = 해시맵(어디 있나) + 이중 연결 리스트(얼마나 오래됐나)</text>
<text class="ts" x="24" y="56">점선 화살표 = 참조(포인터) · 파랑 = GET 경로 · 노랑 = 옮겨진 노드 · 빨강 = 축출 쪽</text>
<rect class="zone" x="24" y="76" width="340" height="228" rx="10"/>
<text x="40" y="100"><tspan class="tb">해시맵 </tspan><tspan class="mono">_store</tspan></text>
<rect class="box" x="36" y="140" width="68" height="28" rx="6"/>
<text class="mono" x="70" y="159" text-anchor="middle">user:3</text>
