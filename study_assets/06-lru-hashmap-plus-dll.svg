<text class="mono" x="220.0" y="443" text-anchor="middle">user:2</text>
<line class="ln ln-purple" x1="264" y1="438" x2="296" y2="438" marker-end="url(#arrow-purple)" marker-start="url(#arrow-purple)"/>
<rect class="purple" x="300" y="422" width="80" height="32" rx="6"/>
<text class="mono" x="340.0" y="443" text-anchor="middle">user:3</text>
<line class="ln ln-purple" x1="384" y1="438" x2="416" y2="438" marker-end="url(#arrow-purple)" marker-start="url(#arrow-purple)"/>
<rect class="box dash" x="420" y="422" width="56" height="32" rx="6"/>
<text class="mono c-muted" x="448.0" y="443" text-anchor="middle">tail</text>
<rect class="red" x="588" y="324" width="268" height="156" rx="10"/>
<text class="tb c-red" x="604" y="350">축출 (메모리가 모자랄 때)</text>
<text class="tb c-red" x="604" y="376">①</text>
<text class="mono" x="626" y="376">_lru.back()</text>
<text class="ts" x="718" y="376">맨 뒤 노드</text>
<text class="tb c-red" x="604" y="400">②</text>
<text x="626" y="400"><tspan class="ts">그 키로 </tspan><tspan class="mono">_store.get</tspan></text>
<text class="tb c-red" x="604" y="424">③</text>
<text class="mono" x="626" y="424">_hard_delete(key, e)</text>
<text class="ts" x="626" y="446">리스트 노드 떼기 · 저장소에서 지우기</text>
<text class="ts" x="626" y="468">· 장부 빼기, 그다음 evicted +1</text>
<text x="24" y="500"><tspan class="ts">코드: </tspan><tspan class="mono">mini_redis.py</tspan><tspan class="ts"> :55 lru_node · :248 move_to_front · :187 back · :195 _hard_delete</tspan></text>
</svg>
