<rect class="purple" x="528" y="140" width="80" height="32" rx="6"/>
<text class="mono" x="568.0" y="161" text-anchor="middle">user:3</text>
<line class="ln ln-purple" x1="612" y1="156" x2="644" y2="156" marker-end="url(#arrow-purple)" marker-start="url(#arrow-purple)"/>
<rect class="purple" x="648" y="140" width="80" height="32" rx="6"/>
<text class="mono" x="688.0" y="161" text-anchor="middle">user:2</text>
<line class="ln ln-purple" x1="732" y1="156" x2="764" y2="156" marker-end="url(#arrow-purple)" marker-start="url(#arrow-purple)"/>
<rect class="box dash" x="768" y="140" width="56" height="32" rx="6"/>
<text class="mono c-muted" x="796.0" y="161" text-anchor="middle">tail</text>
<path class="ln ln-purple dash" d="M256,152 L392,152 L392,196 L568,196 L568,176" marker-end="url(#arrow-purple)"/>
<path class="ln ln-purple dash" d="M256,248 L688,248 L688,176" marker-end="url(#arrow-purple)"/>
<circle class="ah-purple" cx="250" cy="152" r="5"/>
<circle class="ah-purple" cx="250" cy="248" r="5"/>
<rect class="blue" x="24" y="324" width="540" height="156" rx="10"/>
<text class="th c-blue" x="40" y="350">GET user:2</text>
<text class="tb c-blue" x="40" y="378">①</text>
<text class="mono" x="62" y="378">_store.get('user:2')</text>
<text class="ts" x="236" y="378">해시 → 버킷 → 평균 O(1)</text>
<text class="tb c-blue" x="40" y="404">②</text>
<text class="mono" x="62" y="404">move_to_front(entry.lru_node)</text>
<text class="ts" x="306" y="404">포인터 6번 교체, O(1)</text>
<text class="ts" x="40" y="443">결과</text>
