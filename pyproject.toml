# 의존성이 0개인데도 매니페스트를 두는 이유: 이 저장소가 무엇이고, 어떤
# 파이썬에서 도는지, 무엇을 요구하지 않는지를 사람이 아니라 도구가 읽을 수
# 있게 하기 위해서다. 채점은 이 파일 없이 `python main.py` 로도 그대로 돈다.

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "minredis"
version = "1.0.0"
description = "해시맵 / 이중 연결 리스트 / 최소 힙을 직접 구현한 인메모리 키-값 저장소 (CLI)"
readme = "README.md"
# 과제 제약: Python 3.8 이상. 3.9+ 전용 문법은 tests/test_cli.py 의
# TestConstraints 가 AST 로 차단한다.
requires-python = ">=3.8"
# 표준 라이브러리만 사용한다. 이 목록이 비어 있다는 것 자체가 제약의 선언이다.
dependencies = []

[project.scripts]
minredis = "minredis.cli:repl"

[tool.setuptools]
packages = ["minredis"]
